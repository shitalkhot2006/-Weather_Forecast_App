<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Forecast App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #4facfe, #00c6fb);
         min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
  .app { background: #fff; width: 100%; max-width: 640px; border-radius: 16px; padding: 24px;
         box-shadow: 0 8px 24px rgba(0,0,0,.2); align-self: flex-start; }
  h1 { text-align: center; color: #1a4a7a; margin-bottom: 16px; font-size: 1.5rem; }
  .search { display: flex; gap: 8px; margin-bottom: 16px; }
  .search input { flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
  .search button { padding: 10px 18px; font-size: 1rem; background: #1a73e8; color: #fff;
                   border: none; border-radius: 8px; cursor: pointer; }
  .search button:hover { background: #1558b0; }
  .message { text-align: center; color: #c0392b; min-height: 20px; margin-bottom: 8px; }
  .current { text-align: center; margin-bottom: 20px; }
  .current .city { font-size: 1.4rem; font-weight: bold; color: #1a4a7a; }
  .current .temp { font-size: 3rem; margin: 6px 0; }
  .current .details { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; color: #555; }
  .forecast { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .day { flex: 1 1 100px; background: #eef5ff; border-radius: 10px; padding: 10px; text-align: center; }
  .day .name { font-weight: bold; color: #1a4a7a; }
  .day .icon { font-size: 1.8rem; margin: 4px 0; }
  .hidden { display: none; }
  @media (max-width: 480px) {
    .current .temp { font-size: 2.4rem; }
    .day { flex: 1 1 45%; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>Weather Forecast</h1>
  <div class="search">
    <input id="cityInput" type="text" placeholder="Enter city name (e.g. Nagpur)">
    <button id="searchBtn">Search</button>
  </div>
  <div id="message" class="message"></div>

  <div id="result" class="hidden">
    <div class="current">
      <div id="city" class="city"></div>
      <div id="temp" class="temp"></div>
      <div id="desc"></div>
      <div class="details">
        <span id="humidity"></span>
        <span id="wind"></span>
      </div>
    </div>
    <div id="forecast" class="forecast"></div>
  </div>
</div>

<script>
// Free APIs from Open-Meteo - no API key needed
const GEO_URL = "https://geocoding-api.open-meteo.com/v1/search";
const WEATHER_URL = "https://api.open-meteo.com/v1/forecast";

const codes = {
  0: ["Clear sky", "☀️"], 1: ["Mainly clear", "🌤️"], 2: ["Partly cloudy", "⛅"], 3: ["Overcast", "☁️"],
  45: ["Fog", "🌫️"], 48: ["Fog", "🌫️"], 51: ["Light drizzle", "🌦️"], 53: ["Drizzle", "🌦️"],
  55: ["Heavy drizzle", "🌦️"], 61: ["Light rain", "🌧️"], 63: ["Rain", "🌧️"], 65: ["Heavy rain", "🌧️"],
  71: ["Light snow", "🌨️"], 73: ["Snow", "🌨️"], 75: ["Heavy snow", "❄️"],
  80: ["Rain showers", "🌦️"], 81: ["Rain showers", "🌧️"], 82: ["Heavy showers", "⛈️"],
  95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm", "⛈️"], 99: ["Thunderstorm", "⛈️"]
};
const info = (c) => codes[c] || ["Unknown", "🌡️"];

const input = document.getElementById("cityInput");
const message = document.getElementById("message");
const result = document.getElementById("result");

async function getWeather() {
  const city = input.value.trim();
  message.textContent = "";
  result.classList.add("hidden");

  if (!city) { message.textContent = "Please enter a city name."; return; }
  message.style.color = "#555";
  message.textContent = "Loading...";

  try {
    const geoRes = await fetch(`${GEO_URL}?name=${encodeURIComponent(city)}&count=1`);
    const geo = await geoRes.json();
    if (!geo.results || geo.results.length === 0) {
      message.style.color = "#c0392b";
      message.textContent = "City not found. Check the spelling and try again.";
      return;
    }
    const { latitude, longitude, name, country } = geo.results[0];

    const url = `${WEATHER_URL}?latitude=${latitude}&longitude=${longitude}` +
      `&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code` +
      `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
      `&timezone=auto&forecast_days=5`;
    const res = await fetch(url);
    if (!res.ok) throw new Error("Weather request failed");
    const data = await res.json();
    showWeather(name, country, data);
    message.textContent = "";
  } catch (err) {
    message.style.color = "#c0392b";
    message.textContent = "Could not load weather. Check your internet connection.";
  }
}

function showWeather(name, country, data) {
  const cur = data.current;
  const [desc, icon] = info(cur.weather_code);
  document.getElementById("city").textContent = `${name}, ${country}`;
  document.getElementById("temp").textContent = `${icon} ${Math.round(cur.temperature_2m)}°C`;
  document.getElementById("desc").textContent = desc;
  document.getElementById("humidity").textContent = `💧 Humidity: ${cur.relative_humidity_2m}%`;
  document.getElementById("wind").textContent = `💨 Wind: ${cur.wind_speed_10m} km/h`;

  const box = document.getElementById("forecast");
  box.innerHTML = "";
  data.daily.time.forEach((date, i) => {
    const [d, ic] = info(data.daily.weather_code[i]);
    const dayName = new Date(date).toLocaleDateString("en-IN", { weekday: "short" });
    const el = document.createElement("div");
    el.className = "day";
    el.innerHTML = `<div class="name">${dayName}</div><div class="icon">${ic}</div>` +
      `<div>${Math.round(data.daily.temperature_2m_max[i])}° / ${Math.round(data.daily.temperature_2m_min[i])}°</div>` +
      `<div style="font-size:.8rem;color:#555">${d}</div>`;
    box.appendChild(el);
  });
  result.classList.remove("hidden");
}

document.getElementById("searchBtn").addEventListener("click", getWeather);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") getWeather(); });
</script>
</body>
</html>
